plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }


tasks.register('generateReferenceFrameTexture') {
    def generated = layout.buildDirectory.dir('generated/frameAssets')
    outputs.dir(generated)
    doLast {
        def root = generated.get().asFile
        def destination = new File(root, 'assets/transparentpaintings/textures/frame')
        destination.mkdirs()
        def bytes = java.util.Base64.getDecoder().decode(file('model-frame.png.base64').text.trim())
        def source = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(bytes))
        // Pad transparent/unassigned atlas pixels with the nearest solid wood texel.
        // Geometry handles the open center; textured surfaces must never sample alpha=0.
        int sw=source.width, sh=source.height
        int[] filled=new int[sw*sh]
        boolean[] claimed=new boolean[sw*sh]
        def pending=new java.util.ArrayDeque<Integer>()
        for(int yy=0;yy<sh;yy++) for(int xx=0;xx<sw;xx++){
            int i=yy*sw+xx, rgba=source.getRGB(xx,yy)
            if(((rgba>>>24)&255)>127 && !(((rgba>>>16)&255)>238 && ((rgba>>>8)&255)>238 && (rgba&255)>238)){filled[i]=rgba;claimed[i]=true;pending.add(i)}
        }
        while(!pending.isEmpty()){
            int i=pending.removeFirst(), xx=i%sw, yy=(int)(i/sw)
            def neighbors=[]
            if(xx>0)neighbors.add(i-1)
            if(xx+1<sw)neighbors.add(i+1)
            if(yy>0)neighbors.add(i-sw)
            if(yy+1<sh)neighbors.add(i+sw)
            for(int ni:neighbors)if(!claimed[ni]){
                claimed[ni]=true
                filled[ni]=filled[i]
                pending.add(ni)
            }
        }
        // Keep the source's texture pattern and its dark/light pixels.
        // Shift the underlying oak palette to the target wood color.
        def palette = [
          oak: [135,96,55], spruce:[106,72,47], birch:[211,192,137],
          jungle:[166,123,79], acacia:[174,91,57], dark_oak:[75,53,38],
          mangrove:[132,58,55], cherry:[211,149,153], bamboo:[192,177,79],
          pale_oak:[192,186,169], crimson:[126,52,79], warped:[55,121,117]
        ]
        palette.each { wood, target ->
            def image = new java.awt.image.BufferedImage(source.width,source.height,java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for(int y=0;y<source.height;y++) for(int x=0;x<source.width;x++){
                int rgb=filled[y*source.width+x]
                int red=(rgb>>>16)&255, green=(rgb>>>8)&255, blue=rgb&255
                // Transparent source-white parts are never sampled by the frame UVs,
                // but clear them as a second guard against blocking transparent art.
                int alpha=255
                // Preserve every source frame pixel unchanged for Oak.
                // Other woods recolor its RGB channels without changing the
                // spatial grain, highlights, grooves or corner detail.
                double scaleR=target[0]/135.0
                double scaleG=target[1]/96.0
                double scaleB=target[2]/55.0
                int r=Math.min(255,Math.max(0,(int)Math.round(red*scaleR)))
                int g=Math.min(255,Math.max(0,(int)Math.round(green*scaleG)))
                int b=Math.min(255,Math.max(0,(int)Math.round(blue*scaleB)))
                image.setRGB(x,y,(alpha<<24)|(r<<16)|(g<<8)|b)
            }
            javax.imageio.ImageIO.write(image,'png',new File(destination,wood+'.png'))
        }
    }
}
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/frameAssets')
tasks.named('processResources') { dependsOn 'generateReferenceFrameTexture' }
