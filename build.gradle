plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

tasks.register('generateReferenceFrameTexture') {
    def target = layout.buildDirectory.file('generated/frameAssets/assets/transparentpaintings/textures/frame/oak.png')
    outputs.file(target)
    doLast {
        def out = target.get().asFile
        out.parentFile.mkdirs()
        out.bytes = java.util.Base64.decoder.decode(file('frame-oak.png.base64').text.trim())
    }
}
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/frameAssets')
tasks.named('processResources') { dependsOn 'generateReferenceFrameTexture' }
